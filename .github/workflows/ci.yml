name: CI

on:
  push:
    # CI covers both long-lived branches (branch-management spec V2 §5.1).
    # A successful CI run on an `integration` push triggers the test-server
    # deploy in deploy.yml (workflow_run); `main` never deploys anything.
    branches: [main, integration]
    paths-ignore:
      # Docs-only changes skip CI as a cost optimization. Mixed commits
      # (docs + code) still run CI — the workflow is skipped only when
      # every changed file matches an ignore pattern.
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
  # PRs always run CI: branch protection requires the backend/frontend checks,
  # and a workflow skipped by paths-ignore leaves them "waiting for status"
  # forever (docs-only PRs could never merge). CI runs on the PR merge result
  # with read-only permissions and no repository secrets, so fork PRs are safe.
  pull_request:
    branches: [main, integration]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# NOTE: the backend is split into parallel jobs (lint / unit / postgres×2
# shards) so wall-clock time is the slowest single job instead of the serial
# sum. Branch protection required status checks must reference these names:
#   Backend lint (ruff + architecture)
#   Backend tests (unit)
#   Backend tests (postgres 1/2)
#   Backend tests (postgres 2/2)
#   Frontend (i18n + typecheck + build)
jobs:
  backend-lint:
    name: Backend lint (ruff + architecture)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The co-author check needs the full history for commit ranges.
          fetch-depth: 0

      - name: Reject Claude co-author attribution
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          # Commits published before the attribution rule (3e4b9ff, 2026-10-26) are
          # exempt: repository policy forbids rewriting published history, and the
          # attribution guard only applies to new commits. This list is append-only and
          # must never contain a commit created after the rule took effect.
          #
          # This guard is a process safeguard, not a security boundary: the committer
          # identity of a commit is not authenticated. It exists to stop agents from
          # adding AI attribution to new commits, and the rules below are written to
          # keep that intent without flagging commits that merely restate already
          # published attribution.
          ALLOWLIST="aafb726e8e62b708588aa33081ee2a1a492ef84f 2035a8bc0dca068a1f6ece348b0f94d5c0890b23 1e3007ae9bd81b509f166b60759e387d8fa3ca00 e390abe357bf89c727d78ad48be27ff4bc3c6568 1566ff6daa6bc85cd00231e96119ddce8fafe16a 369324343cdfa453dcd4921d151ebd2fa12a5194"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [[ "$EVENT_NAME" == "push" &&
                  "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            range="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
          else
            echo "No commit range to check."
            exit 0
          fi

          offenders=0
          matched="$(
            git log "$range" --format='%H' --regexp-ignore-case --extended-regexp \
              --grep='Co-Authored-By:.*(Claude|Anthropic|noreply@anthropic\.com)'
          )"
          for sha in $matched; do
            committer_email="$(git log -1 --format='%ce' "$sha")"
            subject="$(git log -1 --format='%s' "$sha")"
            # GitHub creates squash commits and pull-request merge commits itself, and when
            # squashing it copies the co-author trailers of every commit in the pull request
            # into the resulting message. Those trailers restate attribution that is already
            # published, so such a commit is not an offender on its own. Matching both the
            # committer identity and the GitHub subject shape keeps locally authored commits
            # (whose committer can be set freely) inside the check.
            if [[ "$committer_email" == "noreply@github.com" ]] &&
               { [[ "$subject" =~ \(#[0-9]+\)$ ]] || [[ "$subject" == "Merge pull request #"* ]]; }; then
              echo "Skipped GitHub-generated commit: $sha $subject"
            elif [[ " $ALLOWLIST " == *" $sha "* ]]; then
              echo "Allowed pre-rule commit: $sha $subject"
            else
              echo "Forbidden co-author attribution: $sha $subject"
              offenders=$((offenders + 1))
            fi
          done

          if [[ "$offenders" -gt 0 ]]; then
            echo "Remove the trailer before merging; do not rewrite published tags."
            exit 1
          fi
          echo "No forbidden co-author attribution found."

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pinned to match the version used by the Dockerfile.
          version: "0.7.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python dependencies
        working-directory: backend
        # Includes the dev group (pytest, pytest-asyncio, ruff, httpx).
        run: uv sync --frozen

      - name: Lint (non-mutating)
        working-directory: backend
        run: uv run ruff check .

      - name: Format check (non-mutating)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="${PR_BASE_SHA}...${PR_HEAD_SHA}"
          elif [[ "$EVENT_NAME" == "push" &&
                  "$PUSH_BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            range="${PUSH_BEFORE_SHA}..${PUSH_AFTER_SHA}"
          else
            echo "No commit range for diff-scoped format check."
            exit 0
          fi

          mapfile -t changed_py < <(
            git diff --name-only --diff-filter=ACMR "$range" -- 'backend/*.py' \
              | sed 's|^backend/||'
          )
          if [[ "${#changed_py[@]}" -eq 0 ]]; then
            echo "No Python files changed under backend/."
            exit 0
          fi
          (cd backend && uv run ruff format --check "${changed_py[@]}")

      - name: Architecture gates
        run: uv run --directory backend python "$GITHUB_WORKSPACE/scripts/check_architecture.py"

      - name: Install Node for JS SDK tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: JS SDK tests
        working-directory: sdk/javascript
        run: npm test

      - name: Verify checks did not mutate tracked files
        run: |
          set -euo pipefail
          git diff --exit-code
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "::error::Quality checks modified tracked files."
            git status --short
            exit 1
          fi

  backend-test-unit:
    name: Backend tests (unit)
    runs-on: ubuntu-latest

    env:
      AGENT_ENVIRONMENT: development

    steps:
      # No fetch-depth: 0 and no Postgres here — unit tests never touch a DB
      # (every DB-touching test carries the `postgres` marker).
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.7.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Test
        id: pytest_unit
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/test-reports"
          uv run pytest -rA --junitxml="${RUNNER_TEMP}/test-reports/unit.xml" -m "not postgres" \
            | tee "${RUNNER_TEMP}/test-reports/unit.log"

      - name: Audit and summarize unit results
        if: success() || failure()
        working-directory: backend
        run: |
          set -euo pipefail
          XML="${RUNNER_TEMP}/test-reports/unit.xml"
          LOG="${RUNNER_TEMP}/test-reports/unit.log"
          SUMMARY="${RUNNER_TEMP}/test-reports/unit-summary.json"
          if [[ ! -f "$XML" ]]; then
            echo "::error::JUnit report missing; infrastructure or collection failure before test execution."
            exit 1
          fi
          uv run python scripts/runtime_baseline.py summary "$XML" --output "$SUMMARY"
          if [[ "${{ steps.pytest_unit.outcome }}" == "success" && -f "$LOG" ]]; then
            uv run python scripts/runtime_baseline.py audit-log "$LOG"
          fi
          uv run python - "$SUMMARY" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          c = data["counts"]
          executed = c["tests"] - c["skipped"]
          skips = [n for n in data["nodes"] if n["outcome"] == "skipped"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Backend tests (unit)\n")
              f.write(
                  f"- Total: {c['tests']} | Executed: {executed} | "
                  f"Failures: {c['failures']} | Infra/Fixture Errors: {c['errors']} | "
                  f"Skipped: {c['skipped']}\n"
              )
              for s in skips:
                  f.write(f"  - SKIP `{s['classname']}.{s['name']}`: {s['skip_reason']}\n")
          if executed <= 0:
              sys.exit("Unit suite executed zero non-skipped tests.")
          PY

      - name: Verify tests did not mutate tracked files
        if: success() || failure()
        run: |
          set -euo pipefail
          git diff --exit-code

  backend-test-postgres:
    # Two parallel shards (pytest-split, count-based). Each shard job gets its
    # own Postgres service, so no cross-shard DB interference; migration tests
    # use randomly named disposable databases and are shard-safe as well.
    name: Backend tests (postgres ${{ matrix.group }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nexusdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexusdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # pytest reads these directly. REQUIRE_POSTGRES_TESTS=1 ensures missing
      # DB URLs fail closed instead of silently skipping integration tests.
      REQUIRE_POSTGRES_TESTS: "1"
      AGENT_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/nexusdesk_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/nexusdesk_test
      # Migration tests create and drop disposable databases, so the role needs
      # CREATEDB; the postgres superuser has it.
      MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/nexusdesk_test
      AGENT_ENVIRONMENT: development

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # Pinned to match the version used by the Dockerfile.
          version: "0.7.21"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python dependencies
        working-directory: backend
        # Includes the dev group (pytest, pytest-asyncio, ruff, httpx).
        run: uv sync --frozen

      - name: Migrate the test database
        id: migrate
        working-directory: backend
        # Required before pytest: the database fixtures expect a migrated schema.
        run: uv run alembic upgrade head

      - name: Test
        id: pytest_pg
        working-directory: backend
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/test-reports"
          uv run pytest -rA --junitxml="${RUNNER_TEMP}/test-reports/pg-${{ matrix.group }}.xml" \
            -m postgres --splits 2 --group ${{ matrix.group }} \
            | tee "${RUNNER_TEMP}/test-reports/pg-${{ matrix.group }}.log"

      - name: Audit and summarize postgres results
        if: (success() || failure()) && steps.migrate.outcome == 'success'
        working-directory: backend
        run: |
          set -euo pipefail
          XML="${RUNNER_TEMP}/test-reports/pg-${{ matrix.group }}.xml"
          LOG="${RUNNER_TEMP}/test-reports/pg-${{ matrix.group }}.log"
          SUMMARY="${RUNNER_TEMP}/test-reports/pg-${{ matrix.group }}-summary.json"
          if [[ ! -f "$XML" ]]; then
            echo "::error::JUnit report missing; infrastructure or collection failure before test execution."
            exit 1
          fi
          uv run python scripts/runtime_baseline.py summary "$XML" --output "$SUMMARY"
          if [[ "${{ steps.pytest_pg.outcome }}" == "success" && -f "$LOG" ]]; then
            uv run python scripts/runtime_baseline.py audit-log "$LOG"
          fi
          uv run python - "$SUMMARY" "${{ matrix.group }}" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          shard = sys.argv[2]
          c = data["counts"]
          executed = c["tests"] - c["skipped"]
          skips = [n for n in data["nodes"] if n["outcome"] == "skipped"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"### Backend tests (postgres {shard}/2)\n")
              f.write(
                  f"- Total: {c['tests']} | Executed: {executed} | "
                  f"Failures: {c['failures']} | Infra/Fixture Errors: {c['errors']} | "
                  f"Skipped: {c['skipped']}\n"
              )
              for s in skips:
                  f.write(f"  - SKIP `{s['classname']}.{s['name']}`: {s['skip_reason']}\n")
          if executed <= 0:
              sys.exit(f"Postgres shard {shard}/2 executed zero non-skipped tests.")
          PY

      - name: Verify tests did not mutate tracked files
        if: success() || failure()
        run: |
          set -euo pipefail
          git diff --exit-code

  frontend:
    name: Frontend (i18n + typecheck + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Check locale files
        working-directory: frontend
        run: npm run check:i18n

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

      - name: Verify frontend checks did not mutate tracked files
        run: |
          set -euo pipefail
          git diff --exit-code
          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "::error::Frontend checks modified tracked files."
            git status --short
            exit 1
          fi
