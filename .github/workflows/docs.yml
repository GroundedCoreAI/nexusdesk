name: Docs

# Publishes the VitePress documentation site to GitHub Pages.
#
# Content lives in `docs/` (bilingual side-by-side files) and `site/` holds the
# site project. `npm run build` first runs `doc-sync`, which maps `docs/` into
# `site/.build/` and refuses to publish anything under `docs/requirement/`.

on:
  push:
    branches: [integration]
    paths:
      - 'docs/**'
      - 'site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Injects the project-site base path (e.g. /nexusdesk/) so assets resolve
      # correctly without hard-coding the repository name in the config.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Sync docs and build site
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
