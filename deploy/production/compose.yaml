name: nexusdesk-production
x-backend: &backend
  image: nexusdesk-backend:${NEXUSDESK_VERSION:-local}
  build:
    context: ../..
    target: backend
    network: ${NEXUSDESK_BUILD_NETWORK:-default}
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
  env_file: .env
  environment:
    AGENT_ENVIRONMENT: production
    AGENT_QUICKSTART_MODE: "false"
    AGENT_EMBEDDED_WORKER: "false"
    AGENT_MODEL_CREDENTIAL_KEY_FILE: /data/credentials/master.key
  volumes:
    - credentials:/data/credentials
  stop_grace_period: 45s
services:
  migrate:
    <<: *backend
    restart: "no"
    command: [python, /app/deploy/bootstrap.py, migrate]
  api:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, /app/deploy/healthcheck.py]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
  runtime-worker:
    <<: *backend
    # YAML merge replaces whole keys (08 R-7): the anchor's credentials volume
    # must be redeclared next to the dedicated execution root, and the
    # anchor's environment map must be redeclared too. API and the other
    # workers deliberately do NOT mount execution_data or set a host id:
    # their absence is itself an AC-12 topology check, and one execution
    # root may only ever have one Host (03 §4.4).
    volumes:
      - credentials:/data/credentials
      - execution_data:/data/execution
    environment:
      AGENT_ENVIRONMENT: production
      AGENT_QUICKSTART_MODE: "false"
      AGENT_EMBEDDED_WORKER: "false"
      AGENT_MODEL_CREDENTIAL_KEY_FILE: /data/credentials/master.key
      # Stable per-execution-root identity; it is what assembles the Runtime
      # Host subsystem on this process only (08 R-7/R-8). Override via
      # NEXUSDESK_RUNTIME_HOST_ID in .env for multi-environment deployments.
      AGENT_EXECUTION_RUNTIME_HOST_ID: ${NEXUSDESK_RUNTIME_HOST_ID:-production-runtime}
      AGENT_EXECUTION_WORKDIR_ROOT: /data/execution
      # The Phase 4 master switch stays off by default; enablement is a
      # rollout decision (03 §8), never a side effect of deploying the volume.
      AGENT_EXECUTION_RUNTIME_HOST_ENABLED: ${AGENT_EXECUTION_RUNTIME_HOST_ENABLED:-false}
    restart: unless-stopped
    command: [python, -m, agent_platform.applications.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
  channel-worker:
    <<: *backend
    restart: unless-stopped
    command: [python, -m, agent_platform.applications.worker.channel]
    depends_on:
      migrate:
        condition: service_completed_successfully
  knowledge-worker:
    <<: *backend
    restart: unless-stopped
    command: [python, -m, agent_platform.applications.worker.knowledge]
    depends_on:
      migrate:
        condition: service_completed_successfully
  memory-worker:
    <<: *backend
    restart: unless-stopped
    command: [python, -m, agent_platform.applications.worker.memory]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    image: nexusdesk-web:${NEXUSDESK_VERSION:-local}
    build:
      context: ../..
      target: web
      network: ${NEXUSDESK_BUILD_NETWORK:-default}
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.28-alpine}
    restart: unless-stopped
    ports:
      - "${NEXUSDESK_BIND:-127.0.0.1}:${NEXUSDESK_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  # Demo upstream for the industry packs' data executors (25 endpoints). Starts
  # by default so a fresh deployment is usable without wiring a real system.
  # The api container reaches it at http://mock-business:8010, which must also
  # appear in AGENT_TOOL_ALLOWED_HOSTS in .env. No host port is published.
  # Before going live against real systems, remove this service and its entry
  # from AGENT_TOOL_ALLOWED_HOSTS: it authenticates nobody and can be told to
  # inject 5xx faults, so leaving it running in production is a liability.
  mock-business:
    image: ${NEXUSDESK_MOCK_IMAGE:-nexusdesk/mock-business-api:local}
    build:
      context: ../../backend/examples/mock_business
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    restart: unless-stopped
    environment:
      MOCK_AUTH_TOKEN: ${MOCK_AUTH_TOKEN:-}
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-0}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  credentials:
  execution_data:
