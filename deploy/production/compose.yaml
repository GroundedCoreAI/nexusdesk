name: nexusdesk-production
x-backend: &backend
  image: nexusdesk-backend:${NEXUSDESK_VERSION:-local}
  build:
    context: ../..
    target: backend
    network: ${NEXUSDESK_BUILD_NETWORK:-default}
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
  env_file: .env
  environment:
    AGENT_ENVIRONMENT: production
    AGENT_QUICKSTART_MODE: "false"
    AGENT_EMBEDDED_WORKER: "false"
    AGENT_MODEL_CREDENTIAL_KEY_FILE: /data/credentials/master.key
  volumes:
    - credentials:/data/credentials
  stop_grace_period: 45s
services:
  migrate:
    <<: *backend
    restart: "no"
    command: [python, /app/deploy/bootstrap.py, migrate]
  api:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, /app/deploy/healthcheck.py]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
  runtime-worker:
    <<: *backend
    restart: unless-stopped
    command: [python, -m, agent_platform.applications.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
  channel-worker:
    <<: *backend
    restart: unless-stopped
    command: [python, -m, agent_platform.applications.worker.channel]
    depends_on:
      migrate:
        condition: service_completed_successfully
  knowledge-worker:
    <<: *backend
    restart: unless-stopped
    command: [python, -m, agent_platform.applications.worker.knowledge]
    depends_on:
      migrate:
        condition: service_completed_successfully
  memory-worker:
    <<: *backend
    restart: unless-stopped
    command: [python, -m, agent_platform.applications.worker.memory]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    image: nexusdesk-web:${NEXUSDESK_VERSION:-local}
    build:
      context: ../..
      target: web
      network: ${NEXUSDESK_BUILD_NETWORK:-default}
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.28-alpine}
    restart: unless-stopped
    ports:
      - "${NEXUSDESK_BIND:-127.0.0.1}:${NEXUSDESK_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

  # Demo upstream for service-application connections (25 endpoints). Starts
  # by default so a fresh deployment is usable without wiring a real system.
  # The api container reaches it at http://mock-business:8010, which must also
  # appear in AGENT_TOOL_ALLOWED_HOSTS in .env. No host port is published.
  # Before going live against real systems, remove this service and its entry
  # from AGENT_TOOL_ALLOWED_HOSTS: it authenticates nobody and can be told to
  # inject 5xx faults, so leaving it running in production is a liability.
  mock-business:
    image: ${NEXUSDESK_MOCK_IMAGE:-nexusdesk/mock-business-api:local}
    build:
      context: ../../backend/examples/mock_business
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    restart: unless-stopped
    environment:
      MOCK_AUTH_TOKEN: ${MOCK_AUTH_TOKEN:-}
      MOCK_LATENCY_MS: ${MOCK_LATENCY_MS:-0}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

volumes:
  credentials:
